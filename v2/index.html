<!DOCTYPE html>

  <title>House PSM</title>
  <link rel="icon" href="/favicon.ico">
  <script>/* v86.61: tema escuro por padrão; v88.62: marca (imoveis|conquista) lembrada no aparelho (toggle no cabeçalho) — roda antes do CSS pra não piscar */
    (function(){try{var t=localStorage.getItem('psm_theme')||'dark';if(t==='dark')document.documentElement.classList.add('dark');document.documentElement.setAttribute('data-marca',localStorage.getItem('psm_marca')||'imoveis');}catch(e){document.documentElement.classList.add('dark');}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <div class="flex items-center gap-2"><span class="spinner"></span> Inicializando House PSM…</div>
  </div>
  <script type="module" src="/v2/js/main.js"></script>
